<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="RBPU.png">
    <title>Rayat Bahra Professional University | Hoshiarpur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;600;800&family=Playfair+Display:italic,wght@400;700&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #1a1a1a; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }

        /* Premium Loader Animation */
        @keyframes lineProgress {
            0% { transform: scaleX(0); transform-origin: left; }
            50% { transform: scaleX(1); transform-origin: left; }
            51% { transform: scaleX(1); transform-origin: right; }
            100% { transform: scaleX(0); transform-origin: right; }
        }
        .loader-line { animation: lineProgress 2s infinite cubic-bezier(0.76, 0, 0.24, 1); }
        
        .page-enter { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .img-zoom { transition: transform 1.2s cubic-bezier(0.2, 0, 0.2, 1); }
        .img-zoom:hover { transform: scale(1.05); }

        .parallax-bg {
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Loading Screen ---
        const Loader = () => (
            <div className="fixed inset-0 z-[500] bg-white flex flex-col items-center justify-center">
                <div className="mb-8 overflow-hidden">
                    <h2 className="text-sm font-bold tracking-[0.5em] uppercase animate-pulse">Rayat Bahra</h2>
                </div>
                <div className="w-48 h-[1px] bg-zinc-100 relative">
                    <div className="absolute inset-0 bg-black loader-line"></div>
                </div>
                <p className="mt-4 text-[10px] text-zinc-400 tracking-widest uppercase">Hoshiarpur Campus</p>
            </div>
        );

        // --- Header / Menu ---
        const Header = ({ activePage, setActivePage }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const menuItems = [
                { id: 'home', label: 'Home' },
                { id: 'about', label: 'About' },
                { id: 'academics', label: 'Academics' },
                { id: 'admissions', label: 'Admissions' },
                { id: 'contact', label: 'Contact' }
            ];

            const handleNav = (id) => {
                setActivePage(id);
                setIsMenuOpen(false);
                window.scrollTo(0,0);
            };

            return (
                <>
                    <nav className={`fixed w-full z-[100] transition-all duration-500 px-6 md:px-12 py-6 flex justify-between items-center ${scrolled ? 'bg-white/80 backdrop-blur-md border-b border-zinc-100' : 'bg-transparent'}`}>
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => handleNav('home')}>
                            <div className="w-8 h-8 bg-black flex items-center justify-center text-white font-bold text-[10px]"><img src="RBPU.png" className="w-full h-full object-cover" alt="RBPU Logo" /></div>
                            <span className="font-extrabold tracking-[0.2em] text-sm uppercase">Rayat Bahra</span>
                        </div>
                        
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="group flex flex-col items-end gap-1.5 z-[110]">
                            <span className={`h-[1.5px] bg-black transition-all duration-500 ${isMenuOpen ? 'w-8 rotate-45 translate-y-[7px]' : 'w-8'}`} />
                            <span className={`h-[1.5px] bg-black transition-all duration-500 ${isMenuOpen ? 'w-8 -rotate-45' : 'w-5 group-hover:w-8'}`} />
                        </button>
                    </nav>

                    <div className={`fixed inset-0 z-[105] bg-white transition-all duration-700 ease-in-out ${isMenuOpen ? 'translate-y-0' : '-translate-y-full'}`}>
                        <div className="h-full flex flex-col items-center justify-center space-y-8">
                            {menuItems.map((item, i) => (
                                <button key={item.id} onClick={() => handleNav(item.id)} className="group overflow-hidden">
                                    <h2 className={`text-5xl md:text-7xl font-light tracking-tighter transition-all duration-500 hover:italic ${activePage === item.id ? 'italic text-black' : 'text-zinc-300 hover:text-black'}`}>
                                        {item.label}
                                    </h2>
                                </button>
                            ))}
                        </div>
                    </div>
                </>
            );
        };

        // --- Home Components ---
        const Home = ({ onAction }) => (
            <div className="page-enter">
                {/* Hero Section */}
                <section className="min-h-screen flex items-center px-6 md:px-12 pt-20">
                    <div className="container mx-auto grid lg:grid-cols-12 gap-12 items-center">
                        <div className="lg:col-span-7 space-y-10">
                            <div className="inline-block px-3 py-1 border border-zinc-200 rounded-full text-[10px] font-bold tracking-widest uppercase text-zinc-400">
                                &bull; North India's Premier Educational Group
                            </div>
                            <h1 className="text-7xl md:text-[10rem] font-light leading-[0.85] tracking-tighter">
                                Infinite <br />
                                <span className="font-serif italic text-zinc-300">Potential.</span>
                            </h1>
                            <p className="max-w-md text-lg text-zinc-500 font-light leading-relaxed">
                                Empowerment through knowledge. Join a community of over 35,000 students shaping the future of global technology and healthcare in Hoshiarpur.
                            </p>
                            <div className="flex gap-6">
                                <button onClick={() => onAction('admissions')} className="px-10 py-5 bg-black text-white text-[10px] font-bold uppercase tracking-widest rounded-full hover:scale-105 transition-transform shadow-lg">Apply Online</button>
                                <button onClick={() => onAction('about')} className="px-10 py-5 border border-zinc-200 text-[10px] font-bold uppercase tracking-widest rounded-full hover:bg-zinc-50 transition-colors">Discover RB</button>
                            </div>
                        </div>
                        <div className="lg:col-span-5 relative">
                            <div className="aspect-[4/5] rounded-[2.5rem] overflow-hidden shadow-2xl relative">
                                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000" alt="Campus Main Building" />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
                            </div>
                            <div className="absolute -bottom-10 -left-10 bg-white p-8 rounded-2xl shadow-xl hidden md:block border border-zinc-100">
                                <p className="text-4xl font-bold">24+</p>
                                <p className="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Years of Excellence</p>
                            </div>
                        </div>
                    </div>
                </section>

                {/* Stats Section */}
                <section className="py-32 bg-zinc-50">
                    <div className="container mx-auto px-6 grid md:grid-cols-4 gap-12">
                        {[
                            { n: "100+", l: "Acre Lush Green Campus" },
                            { n: "35k+", l: "Students Worldwide" },
                            { n: "500+", l: "Expert Faculty" },
                            { n: "1000+", l: "Annual Placements" }
                        ].map((s, i) => (
                            <div key={i} className="space-y-2 border-l border-zinc-200 pl-8">
                                <h3 className="text-5xl font-light tracking-tighter">{s.n}</h3>
                                <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-[0.2em]">{s.l}</p>
                            </div>
                        ))}
                    </div>
                </section>

                {/* Chairman's Message */}
                <section className="py-32 px-6">
                    <div className="container mx-auto grid lg:grid-cols-2 gap-24 items-center">
                        <div className="relative">
                            <div className="aspect-square rounded-[3rem] overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=800" className="w-full h-full object-cover grayscale" alt="Chairman" />
                            </div>
                            <div className="absolute top-10 -right-10 bg-zinc-900 text-white p-10 rounded-3xl max-w-xs hidden lg:block">
                                <p className="italic font-serif text-lg mb-4">"Our goal is to create global leaders who are socially responsible and technically sound."</p>
                                <p className="text-[10px] font-bold uppercase tracking-widest">S. Gurvinder Singh Bahra</p>
                                <p className="text-[8px] text-zinc-500 uppercase tracking-widest">Chairman, Rayat Bahra Group</p>
                            </div>
                        </div>
                        <div className="space-y-8">
                            <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-[0.4em]">Leadership</p>
                            <h2 className="text-5xl md:text-7xl font-light tracking-tighter">A Vision for <br /><span className="italic font-serif text-zinc-300">Transformation.</span></h2>
                            <p className="text-zinc-500 leading-relaxed font-light text-lg">
                                Rayat Bahra Professional University has emerged as a premier destination for higher education in North India. At our Hoshiarpur campus, we blend traditional values with modern technology to provide an environment that fosters creativity and innovation. 
                            </p>
                            <p className="text-zinc-500 leading-relaxed font-light">
                                We believe in holistic development. From state-of-the-art labs to international exchange programs, every aspect of our curriculum is designed to make our students industry-ready and future-proof.
                            </p>
                        </div>
                    </div>
                </section>

                {/* Why Choose Us - Features Grid */}
                <section className="py-32 bg-black text-white px-6">
                    <div className="container mx-auto">
                        <div className="flex flex-col md:flex-row justify-between items-end mb-24 gap-8">
                            <div className="max-w-xl">
                                <h2 className="text-5xl md:text-7xl font-light tracking-tighter leading-none">Unmatched <br />Infrastructure.</h2>
                            </div>
                            <p className="text-zinc-500 max-w-xs text-sm uppercase tracking-widest leading-loose">
                                We provide a world-class environment that inspires learning and collaboration.
                            </p>
                        </div>
                        <div className="grid md:grid-cols-3 gap-px bg-zinc-800 border border-zinc-800">
                            {[
                                { t: "Digital Classrooms", d: "Equipped with smart boards and high-speed connectivity for immersive learning." },
                                { t: "Research Hubs", d: "Dedicated centers for IoT, AI, and Sustainable Energy in collaboration with industry." },
                                { t: "Global Network", d: "Tie-ups with international universities for student exchange and joint research." },
                                { t: "Sports Complex", d: "Olympic-size swimming pool, indoor stadiums, and expansive sports grounds." },
                                { t: "24/7 Security", d: "A safe, secure, and ragging-free campus with high-definition CCTV surveillance." },
                                { t: "Modern Hostels", d: "On-campus residential facilities with all modern amenities and nutritious dining." }
                            ].map((f, i) => (
                                <div key={i} className="bg-black p-12 hover:bg-zinc-900 transition-colors group">
                                    <span className="text-zinc-800 text-5xl font-light group-hover:text-zinc-500 transition-colors">0{i+1}</span>
                                    <h4 className="text-xl font-bold mt-8 mb-4 tracking-tight">{f.t}</h4>
                                    <p className="text-zinc-500 text-sm leading-relaxed font-light">{f.d}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>

                {/* Student Life Gallery */}
                <section className="py-32 px-6">
                    <div className="container mx-auto">
                        <div className="mb-20 text-center">
                            <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-[0.4em] mb-4">Life at RB</p>
                            <h2 className="text-5xl md:text-7xl font-light tracking-tighter">Beyond the Classroom.</h2>
                        </div>
                        <div className="grid md:grid-cols-4 gap-6">
                            <div className="md:col-span-2 aspect-[16/9] rounded-[2rem] overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover img-zoom" alt="Events" />
                            </div>
                            <div className="aspect-square rounded-[2rem] overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=800" className="w-full h-full object-cover img-zoom" alt="Lab Work" />
                            </div>
                            <div className="aspect-square rounded-[2rem] overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=80&w=800" className="w-full h-full object-cover img-zoom" alt="Discussion" />
                            </div>
                            <div className="aspect-square rounded-[2rem] overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=800" className="w-full h-full object-cover img-zoom" alt="Tech Fest" />
                            </div>
                            <div className="md:col-span-2 aspect-[16/9] rounded-[2rem] overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1491438590914-bc09fcaaf77a?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover img-zoom" alt="Celebrations" />
                            </div>
                            <div className="aspect-square rounded-[2rem] overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&q=80&w=800" className="w-full h-full object-cover img-zoom" alt="Cultural" />
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        );

        const About = () => (
            <div className="page-enter pt-48 pb-32 px-6">
                <div className="container mx-auto max-w-5xl">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-[0.4em] mb-4">The Vision</p>
                    <h1 className="text-6xl md:text-8xl font-light tracking-tighter mb-12">Educating <br /><span className="font-serif italic text-zinc-300">Generations.</span></h1>
                    
                    <div className="grid md:grid-cols-2 gap-24 items-start mb-32">
                        <div className="space-y-8 text-xl text-zinc-500 font-light leading-relaxed">
                            <p>Founded by the visionary S. Gurvinder Singh Bahra, the Rayat Bahra Group has become a leader in technical and professional education in North India.</p>
                            <p>Our Hoshiarpur campus, nestled in a lush green environment, provides a perfect ecosystem for academic growth and personality development.</p>
                        </div>
                        <div className="rounded-[3rem] overflow-hidden aspect-square shadow-2xl">
                            <img src="https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover" alt="History" />
                        </div>
                    </div>
                </div>
            </div>
        );

        const Academics = () => (
            <div className="page-enter pt-48 pb-32 px-6 bg-zinc-50">
                <div className="container mx-auto">
                    <div className="mb-24">
                        <h2 className="text-5xl md:text-7xl font-light tracking-tighter">Diverse <br />Departments.</h2>
                    </div>
                    <div className="grid md:grid-cols-3 gap-8">
                        {[
                            { t: 'Engineering & Technology', d: 'Computer Science, Mechanical, Civil, ECE.', i: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&q=80&w=600' },
                            { t: 'Pharmacy & Nursing', d: 'B.Pharmacy, D.Pharmacy, GNM, B.Sc Nursing.', i: 'https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&q=80&w=600' },
                            { t: 'Management & Law', d: 'MBA, BBA, B.Com, LLB, BALLB.', i: 'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&q=80&w=600' },
                            { t: 'Medical Sciences', d: 'Advanced clinical training and healthcare studies.', i: 'https://images.unsplash.com/photo-1505751172107-59d0047a130d?auto=format&fit=crop&q=80&w=600' },
                            { t: 'Basic Sciences', d: 'Physics, Chemistry, Maths, and Biotechnology.', i: 'https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&q=80&w=600' },
                            { t: 'Skill Development', d: 'Short-term vocational and industry-ready courses.', i: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&q=80&w=600' }
                        ].map((c, i) => (
                            <div key={i} className="group bg-white rounded-[2rem] overflow-hidden shadow-sm hover:shadow-xl transition-all duration-700">
                                <div className="h-48 overflow-hidden">
                                    <img src={c.i} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" alt={c.t} />
                                </div>
                                <div className="p-8">
                                    <h4 className="text-lg font-bold mb-2 tracking-tight">{c.t}</h4>
                                    <p className="text-sm text-zinc-400 font-light">{c.d}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const Admissions = () => (
            <div className="page-enter pt-48 pb-32 px-6 bg-white">
                <div className="container mx-auto max-w-6xl grid lg:grid-cols-2 gap-24">
                    <div>
                        <h2 className="text-6xl md:text-8xl font-light tracking-tighter mb-12 leading-none">Your Journey <br />Starts Here.</h2>
                        <div className="space-y-12">
                            <div className="flex gap-8">
                                <div className="text-4xl font-light text-zinc-200">01</div>
                                <div>
                                    <h4 className="font-bold text-xs uppercase tracking-widest mb-2">Apply Online</h4>
                                    <p className="text-zinc-500 text-sm">Register through our portal and submit your details.</p>
                                </div>
                            </div>
                            <div className="flex gap-8">
                                <div className="text-4xl font-light text-zinc-200">02</div>
                                <div>
                                    <h4 className="font-bold text-xs uppercase tracking-widest mb-2">Counseling</h4>
                                    <p className="text-zinc-500 text-sm">Interact with our experts to find the best fit for you.</p>
                                </div>
                            </div>
                            <div className="flex gap-8">
                                <div className="text-4xl font-light text-zinc-200">03</div>
                                <div>
                                    <h4 className="font-bold text-xs uppercase tracking-widest mb-2">Success</h4>
                                    <p className="text-zinc-500 text-sm">Welcome to the Rayat Bahra family.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="bg-zinc-50 p-12 rounded-[3rem] border border-zinc-100">
                        <form className="space-y-6" onSubmit={e => e.preventDefault()}>
                            <div className="space-y-4">
                                <input className="w-full p-5 bg-white rounded-2xl border-none outline-none ring-1 ring-zinc-200 focus:ring-black transition-all" placeholder="Full Name" />
                                <input className="w-full p-5 bg-white rounded-2xl border-none outline-none ring-1 ring-zinc-200 focus:ring-black transition-all" placeholder="Mobile Number" />
                                <select className="w-full p-5 bg-white rounded-2xl border-none outline-none ring-1 ring-zinc-200 focus:ring-black transition-all appearance-none text-zinc-400">
                                    <option>Interested Course</option>
                                    <option>B.Tech / M.Tech</option>
                                    <option>Nursing / Pharmacy</option>
                                    <option>Management / BBA</option>
                                </select>
                                <textarea className="w-full p-5 bg-white rounded-2xl border-none outline-none ring-1 ring-zinc-200 focus:ring-black transition-all h-32" placeholder="Message"></textarea>
                            </div>
                            <button className="w-full py-5 bg-black text-white rounded-full text-[10px] font-bold uppercase tracking-[0.3em] shadow-lg">Submit Application</button>
                        </form>
                    </div>
                </div>
            </div>
        );

        const Contact = () => (
            <div className="page-enter pt-48 pb-32 px-6">
                <div className="container mx-auto text-center max-w-4xl">
                    <h1 className="text-7xl md:text-[9rem] font-light tracking-tighter mb-24 italic font-serif text-zinc-100">Contact.</h1>
                    <div className="grid md:grid-cols-3 gap-12 text-left">
                        <div className="space-y-4">
                            <h4 className="text-[10px] font-bold uppercase tracking-widest text-zinc-400">Call Us</h4>
                            <p className="text-xl">+91 99884 00354</p>
                            <p className="text-xl">+91 188 227 5500</p>
                        </div>
                        <div className="space-y-4">
                            <h4 className="text-[10px] font-bold uppercase tracking-widest text-zinc-400">Mail Us</h4>
                            <p className="text-xl">info@rayatbahra.com</p>
                            <p className="text-xl">admission@rayatbahra.com</p>
                        </div>
                        <div className="space-y-4">
                            <h4 className="text-[10px] font-bold uppercase tracking-widest text-zinc-400">Find Us</h4>
                            <p className="text-lg leading-relaxed">Hoshiarpur-Chandigarh Road, Bohan, Punjab 146001, India.</p>
                        </div>
                    </div>
                    <div className="mt-32 h-[400px] w-full bg-zinc-100 rounded-[3rem] overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover grayscale" alt="Map Placeholder" />
                    </div>
                </div>
            </div>
        );

        const Footer = () => (
            <footer className="py-20 bg-black text-white px-6">
                <div className="container mx-auto">
                    <div className="grid md:grid-cols-4 gap-12 mb-20">
                        <div className="col-span-2">
                             <h2 className="text-2xl font-extrabold tracking-tighter mb-4">RBPU HOSHIARPUR</h2>
                             <p className="text-zinc-500 max-w-xs text-sm font-light">Join the ranks of thousands of successful professionals who started their journey at Rayat Bahra.</p>
                        </div>
                        <div className="space-y-4">
                            <h4 className="text-[10px] font-bold uppercase tracking-widest text-zinc-400">Campuses</h4>
                            <ul className="text-sm text-zinc-500 space-y-2">
                                <li>Hoshiarpur</li>
                                <li>Mohali</li>
                                <li>Ropar</li>
                                <li>Patiala</li>
                            </ul>
                        </div>
                        <div className="space-y-4">
                             <h4 className="text-[10px] font-bold uppercase tracking-widest text-zinc-400">Resources</h4>
                             <ul className="text-sm text-zinc-500 space-y-2">
                                <li>Student Portal</li>
                                <li>Alumni Association</li>
                                <li>Scholarship Details</li>
                                <li>Career Services</li>
                            </ul>
                        </div>
                    </div>
                    <div className="pt-12 border-t border-zinc-900 flex flex-col md:flex-row justify-between items-center gap-8">
                        <div className="flex gap-12 text-[10px] font-bold uppercase tracking-[0.3em] text-zinc-500">
                            <span className="hover:text-white cursor-pointer transition-colors">Instagram</span>
                            <span className="hover:text-white cursor-pointer transition-colors">LinkedIn</span>
                            <span className="hover:text-white cursor-pointer transition-colors">Twitter</span>
                        </div>
                        <p className="text-zinc-700 text-[10px] uppercase tracking-widest">© 2026 Rayat Bahra Group. Designed for Future Leaders.</p>
                    </div>
                </div>
            </footer>
        );

        // --- Main App ---
        function App() {
            const [activePage, setActivePage] = useState('home');
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                setTimeout(() => setIsLoading(false), 2500);
            }, []);

            return (
                <div>
                    {isLoading && <Loader />}
                    <Header activePage={activePage} setActivePage={setActivePage} />
                    
                    <main className="min-h-screen">
                        {activePage === 'home' && <Home onAction={setActivePage} />}
                        {activePage === 'about' && <About />}
                        {activePage === 'academics' && <Academics />}
                        {activePage === 'admissions' && <Admissions />}
                        {activePage === 'contact' && <Contact />}
                    </main>

                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
